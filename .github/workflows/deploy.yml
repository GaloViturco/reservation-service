name: Deploy Reservation Services to EC2

on:
  push:
    branches:
      - test  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
    - name: Set up SSH key for EC2
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker images for add and get friends services
      run: |
        docker build -t galo12/dating ./dating_service

    - name: Push images to Docker Hub
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker push galo12/dating

    - name: Deploy services to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 54.173.45.60 
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # stop
          docker stop dating || true
          docker rm dating || true

          # Download
          docker pull galo12/dating

          # Ejecute
          docker run -d --name dating -p 8001:8001 --restart unless-stopped galo12/dating